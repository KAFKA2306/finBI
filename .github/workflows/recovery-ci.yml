name: Recovery import audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  import-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile recovery modules
        run: python -m py_compile code/categories.py code/settings.py code/provider_status.py code/your_streamlit_app.py
      - name: Run offline recovery tests
        run: python -m unittest discover -s code/tests -v
      - name: Verify credential-free diagnostic
        run: python code/your_streamlit_app.py --diagnose > recovery-status.json
      - name: Assert no live provider access was attempted
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("recovery-status.json").read_text())
          assert report["mode"] == "RECOVERY_OFFLINE"
          assert report["investment_decision_ready"] is False
          assert all(not item["live_access_attempted"] for item in report["providers"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-status
          path: recovery-status.json
