name: Static Python BI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"

      - name: Run fast quality gates
        run: uvx --from prek==0.4.11 prek run --all-files

      - name: Verify canonical design contract
        run: node web/.kafka-design/portable-conformance.mjs --consumer "$GITHUB_WORKSPACE"

      - name: Verify canonical investor2 FX artifact
        env:
          FX_OVERLAY_URL: https://kafka2306.github.io/investor2/artifacts/api/v1/portfolio/fx-overlay.json
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "${FX_OVERLAY_URL}?smoke=${GITHUB_SHA}" \
            -o /tmp/investor2-fx-overlay.json
          python - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("/tmp/investor2-fx-overlay.json").read_text())
          assert artifact["schema_version"] == "investor2.fx-overlay.v1"
          assert artifact["status"] in {"VERIFIED", "TEST_ONLY", "UNVERIFIED"}
          if artifact["status"] == "UNVERIFIED":
              assert set(artifact) == {"schema_version", "status", "reason"}
              assert artifact["reason"].strip()
          else:
              required = {
                  "currentUsdExposure",
                  "recommendedIncrementalUsdExposure",
                  "recommendedTotalUsdExposure",
                  "oos",
                  "baselines",
              }
              assert required <= artifact.keys()
          PY

      - name: Build public root
        run: |
          mkdir -p site/data/snapshots site/data/questions site/code site/kafka-design
          cp web/index.html web/app.js web/fx.js web/fx.css web/question-router.js web/worker.mjs web/styles.css site/
          sed 's#".kafka-design/#"kafka-design/#g' web/design-tokens.css > site/design-tokens.css
          cp web/.kafka-design/*.css site/kafka-design/
          cp data/snapshots/*.json site/data/snapshots/
          cp data/questions/*.json site/data/questions/
          cp code/static_bi.py site/code/

      - name: Smoke-test public routes
        run: |
          python -m http.server 8123 -d site >/tmp/finbi-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8123/ | grep -q 'Financial BI'
          curl --fail --silent http://127.0.0.1:8123/ | grep -q 'USD exposure overlay'
          curl --fail --silent http://127.0.0.1:8123/ | grep -q '2年と10年を'
          curl --fail --silent http://127.0.0.1:8123/styles.css | grep -q 'design-tokens.css'
          curl --fail --silent http://127.0.0.1:8123/design-tokens.css | grep -q 'kafka-design:managed-start'
          curl --fail --silent http://127.0.0.1:8123/design-tokens.css | grep -q '"kafka-design/kafka-tokens.css"'
          ! curl --fail --silent http://127.0.0.1:8123/design-tokens.css | grep -q '".kafka-design/'
          curl --fail --silent http://127.0.0.1:8123/design-tokens.css | grep -q 'desk-card:not(.is-live)'
          curl --fail --silent http://127.0.0.1:8123/kafka-design/kafka-tokens.css | grep -q -- '--k-color-canvas'
          curl --fail --silent http://127.0.0.1:8123/kafka-design/kafka-components.css | grep -q 'k-dashboard-decision'
          curl --fail --silent http://127.0.0.1:8123/fx.css | grep -q -- '--k-dimension-table-row'
          curl --fail --silent http://127.0.0.1:8123/fx.js | grep -q 'https://kafka2306.github.io/investor2/artifacts/api/v1/portfolio/fx-overlay.json'
          ! curl --fail --silent http://127.0.0.1:8123/fx.js | grep -q './data/snapshots/investor2-fx-overlay.json'
          curl --fail --silent http://127.0.0.1:8123/question-router.js >/dev/null
          curl --fail --silent http://127.0.0.1:8123/data/questions/catalog.v1.json | grep -q 'finbi.question-catalog.v1'
          ! curl --fail --silent http://127.0.0.1:8123/data/questions/router.v1.json >/dev/null
          curl --fail --silent http://127.0.0.1:8123/data/snapshots/fred-dgs10-2026-07-20_2026-07-23.json >/dev/null
          curl --fail --silent http://127.0.0.1:8123/data/snapshots/fred-dgs2-2026-07-20_2026-07-23.json >/dev/null
          curl --fail --silent http://127.0.0.1:8123/code/static_bi.py | grep -q 'compare_curve_json'
          ! curl --fail --silent http://127.0.0.1:8123/code/static_bi.py | grep -q 'analyze_fx_snapshot'

      - name: Remove generated residue
        run: |
          rm -rf site
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Verify clean checkout
        run: test -z "$(git status --porcelain --untracked-files=all)"

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --silent --output /tmp/pages.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages is not enabled yet; deployment is intentionally skipped.'
          fi

      - name: Build Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p site/data/snapshots site/data/questions site/code site/kafka-design
          cp web/index.html web/app.js web/fx.js web/fx.css web/question-router.js web/worker.mjs web/styles.css site/
          sed 's#".kafka-design/#"kafka-design/#g' web/design-tokens.css > site/design-tokens.css
          cp web/.kafka-design/*.css site/kafka-design/
          cp data/snapshots/*.json site/data/snapshots/
          cp data/questions/*.json site/data/questions/
          cp code/static_bi.py site/code/

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

  public-e2e:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install browser test driver
        run: python -m pip install 'selenium==4.47.0'
      - name: Verify deployed Pages on desktop and mobile widths
        env:
          FINBI_PUBLIC_URL: https://kafka2306.github.io/finBI/
        run: python code/tests/public_pages_e2e.py
