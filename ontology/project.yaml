project:
  id: "kafka:finBI"
  name: "Financial Business Intelligence"
  repository: "https://github.com/KAFKA2306/finBI"
  version: "0.1.0"
  updated: "2026-10-08"
  core_ontology: "https://raw.githubusercontent.com/KAFKA2306/know/main/ontology/causal-evidence-core.yaml"
  schema: "https://raw.githubusercontent.com/KAFKA2306/know/main/ontology/project.schema.json"

purpose:
  problem: "Present source-bound canonical financial analytics without competing with calculation owners."
  intended_decisions: ["display_verified","display_unverified","suppress_view"]
  success_conditions:
    - "Canonical calculation results are never silently recomputed."
    - "An unknown source or stale artifact displays UNVERIFIED."
    - "Private account data never enters Pages."
  falsification_conditions:
    - "Synthetic values are presented as live."
    - "A presentation view becomes a second portfolio calculation owner."

scope:
  included: ["canonical output","rates snapshot","FX view","source identity","verified status"]
  excluded: ["private account data","second calculation authority","synthetic live returns"]
  temporal: "Source event time, effective time, snapshot retrieval and decision time remain distinguishable."
  abstraction_level: "Domain-specific evidence, guarded decisions and source authority."

competency_questions:
  - "What source and time back this metric?"
  - "Does the owning artifact report VERIFIED or UNVERIFIED?"
  - "Is the view merely PLANNED or actually available?"

domain_mapping:
  System: "CanonicalFinancialReadOnlyPresentation"
  State: ["canonical status","freshness state","view state"]
  Action: ["read canonical artifact","validate freshness","display view","suppress unknown"]
  Process: ["read-only adapter","status propagation","Pages publication"]
  Observation: ["published FX artifact","Treasury rate snapshot","owner status"]
  Model: ["read-only view adapter","rates presentation calculation"]
  Requirement: ["owner authority","public-private separation","freshness","no fake live status"]
  Claim: ["displayed metric backed by source","public artifact freshness"]
  Evidence: ["investor2 canonical FX artifact","Treasury snapshot","GitHub Pages verified artifact"]
  Decision: ["display_verified","display_unverified","suppress_view"]

claims_and_evidence:
  assertion_types: ["ObservedFact","ReportedFact","CalculatedValue","ModelEstimate","RequirementAssertion","DecisionAssertion"]
  required_evidence:
    MaterialClaim: ["source identity","event or effective date","entity identity","status"]
    Decision: ["explicit rule","supporting evidence","decision time"]
  unknown_policy: "Missing, stale or scope-mismatched evidence blocks promotion to verified state."

decision_rules:
  - id: "display_verified_view"
    when: "Owner artifact has valid source, observed time and verified status"
    result: "display_verified"
  - id: "missing-evidence"
    when: "Required supporting evidence cannot be verified."
    result: "REVIEW_REQUIRED"

provenance:
  sources: ["investor2 canonical FX artifact","Treasury snapshot","GitHub Pages verified artifact"]
  generated_artifacts: ["code/static_bi.py","README.md"]
  agents: ["existing repository scripts","GitHub Actions","human reviewer"]
  lineage: "Source observation -> versioned canonical entity -> validation -> decision -> published result."

validation:
  structural: "Canonical record identity, source metadata and artifact signatures must validate."
  semantic: "Observed facts, derived views, forecasts, authorizations and assertions remain separate."
  evidence: "Evidence dates, versions, scopes and sources must support each material decision."
  publication: "Published status follows canonical artifact evidence and does not imply unavailable production behavior."

operational_model:
  implementation_status: "mapping to existing source workflows; execution requires independent evidence"
  canonical_sources: ["code/static_bi.py","README.md"]
  objects: ["CanonicalArtifact","Metric","View","Status","Evidence"]
  links:
    - ["CanonicalArtifact","SUPPLIES","View"]
    - ["Metric","DERIVED_FROM","CanonicalArtifact"]
    - ["Evidence","SUPPORTS","Status"]
  actions:
    - id: "display_verified_view"
      preconditions: "Owner artifact has valid source, observed time and verified status"
      recorded_effect: "Public read-only view displays owner data and status unchanged"
      rollback_or_recovery: "Suppress stale data and retain UNVERIFIED status"
  outcome_metrics: ["canonical_view_coverage","source_freshness","unverified_view_count"]
