<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>finBI static snapshot viewer</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;line-height:1.5}main{display:grid;gap:1rem}.panel{border:1px solid #ccc;border-radius:12px;padding:1rem}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.5rem}.warning{font-weight:700}button,select{font:inherit;padding:.5rem}.result{font-size:1.2rem;font-weight:700}
  </style>
</head>
<body>
<main>
  <h1>finBI — 検証済みsnapshot比較</h1>
  <p class="warning">これは保存済みsnapshotの探索UIです。現在値・live market dashboard・投資助言ではありません。</p>
  <section class="panel meta" id="metadata"></section>
  <section class="panel">
    <label>開始日 <select id="start"></select></label>
    <label>終了日 <select id="end"></select></label>
    <button id="compare">Pythonで比較</button>
    <p id="status">snapshotを読み込み中…</p>
    <p class="result" id="result"></p>
  </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
